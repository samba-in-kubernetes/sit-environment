---
- name: Check if config.yml exists
  stat:
    path: "{{ site_dir }}/config.yml"
  register: config_yml

- name: Generate configuration
  when: not config_yml.stat.exists
  vars:
    os: "{{ use_distro | default('centos10') }}"
    be: "{{ (backend | default('xfs') | split('.'))[0] }}"
    variant: "{{ (backend | default('xfs') | split('.'))[1] | default('default') }}"
  block:
    - name: Load global settings
      include_vars:
        name: global_settings
        file: "{{ playbook_dir }}/settings.yml"

    - name: Load personal settings
      include_vars:
        name: personal_settings
        file: ~/.site/settings.yml
      failed_when: false

    - name: Load local settings
      include_vars:
        name: local_settings
        file: "{{ site_dir }}/settings.yml"
      failed_when: false

    - name: Combine settings
      set_fact:
        settings: >-
          {{
             global_settings |
             combine(personal_settings, local_settings,
                     recursive = true, list_merge = 'append_rp')
          }}

    - name: Generate config.yml
      template:
        src: config.yml.j2
        dest: "{{ site_dir }}/config.yml"
      vars:
        max_memory: "{{ ansible_facts.memfree_mb }}"
        max_cpu: "{{ ansible_facts.processor_nproc }}"

- name: Create ssh directory
  file:
    path: "{{ site_dir }}/ssh"
    state: directory

# TODO: Use openssh_keypair action
- name: Create SSH key
  command:
    cmd: >-
      ssh-keygen
        -C "SITE SSH Key"
        -f {{ site_dir }}/ssh/id_rsa
        -N ""
        -t rsa
        -b 2048
    creates: "{{ site_dir }}/ssh/id_rsa"
