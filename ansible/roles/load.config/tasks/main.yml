---
- name: Load global configuration
  include_vars:
    file: "{{ site_dir }}/config.yml"

- name: Load cluster configuration
  include_vars:
    file: "{{ playbook_dir }}/cluster-{{ config.be.name }}.yml"

- name: Current configuration
  run_once: true
  debug:
    var: config

- name: Check NetBIOS name length
  when: site.netbios | length > 15
  fail:
    msg: "NetBIOS name of {{ inventory_hostname }} is too long ({{ site.netbios }})"
