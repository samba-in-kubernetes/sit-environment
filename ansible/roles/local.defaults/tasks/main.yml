---
- name: Check if config.yml exists
  stat:
    path: "{{ site_dir }}/config.yml"
  register: config_yml

- name: Generate configuration
  when: not config_yml.stat.exists
  vars:
    os: "{{ use_distro | default('centos9') }}"
    be: "{{ (backend | default('xfs') | split('.'))[0] }}"
    variant: "{{ (backend | default('xfs') | split('.'))[1] | default('default') }}"
  block:
    - name: Load global settings
      include_vars:
        name: global_settings
        file: "{{ playbook_dir }}/settings.yml"

    - name: Load personal settings
      include_vars:
        name: personal_settings
        file: ~/.site/settings.yml
      failed_when: false

    - name: Load local settings
      include_vars:
        name: local_settings
        file: "{{ site_dir }}/settings.yml"
      failed_when: false

    - name: Combine settings
      set_fact:
        settings: >-
          {{
             global_settings |
             combine(personal_settings, local_settings,
                     recursive = true, list_merge = 'append_rp')
          }}

    - name: Generate config.yml
      template:
        src: config.yml.j2
        dest: "{{ site_dir }}/config.yml"
      vars:
        max_memory: "{{ ansible_facts.memfree_mb }}"
        max_cpu: "{{ ansible_facts.processor_nproc }}"

- name: Load configuration
  include_vars:
    file: "{{ site_dir }}/config.yml"

- debug:
    var: config

- name: Create ssh directory
  file:
    path: "{{ site_dir }}/ssh"
    state: directory

# TODO: Use openssh_keypair action
- name: Create SSH key
  command:
    cmd: >-
      ssh-keygen
        -C "SITE SSH Key"
        -f {{ site_dir }}/ssh/id_rsa
        -N ""
        -t rsa
        -b 2048
    creates: "{{ site_dir }}/ssh/id_rsa"

- name: Update the inventory
  add_host:
    name: "{{ item }}"
    ansible_user: root
    ansible_port: 22
    ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
    ansible_ssh_private_key_file: "{{ site_dir }}/ssh/id_rsa"
    groups: "{{ config.nodes[item].groups + ['site'] }}"
    site: "{{ config.nodes[item] }}"
  with_items: "{{ config.nodes.keys() }}"

- name: Create state directory structure on host
  file:
    path: "{{ config.statedir }}/{{ item }}"
    state: directory
  loop: "{{ groups['site'] }}"

- name: Copy common playbook configuration
  copy:
    src: "{{ site_dir }}/config.yml"
    dest: "{{ config.statedir }}"
