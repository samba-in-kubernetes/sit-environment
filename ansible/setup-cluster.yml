---
- hosts: localhost
  connection: local
  become: no
  gather_facts: false
  roles:
    - update.inventory

- hosts: cluster
  become: yes
  become_method: sudo
  roles:
    - load.config
    - common.prep
    - node.prep
    - "sit.{{ config.be.name }}"
    - role: samba.install
      when: config.samba
    - role: samba.setup
      when: config.samba
    - role: ctdb.setup
      when: config.samba
    - role: users.setup
      when: config.users
