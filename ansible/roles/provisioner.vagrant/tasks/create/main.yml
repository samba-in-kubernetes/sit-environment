---
- name: Setup Vagrant file
  run_once: true
  template:
    src: Vagrantfile.j2
    dest: "{{ site_dir }}/Vagrantfile"

- name: start vagrant vms
  run_once: true
  command: vagrant up --no-provision
  args:
    chdir: "{{ site_dir }}"

- name: provision vagrant vms
  run_once: true
  command: vagrant provision
  args:
    chdir: "{{ site_dir }}"

- name: Get IP address
  command: vagrant ssh {{ inventory_hostname }} -c "ip -j -4 addr show scope global"
  args:
    chdir: "{{ site_dir }}"
  register: vm_ip

- name: Extract IP address
  set_fact:
    host_ip: "{{ (vm_ip.stdout | from_json)[0].addr_info[0].local }}"
