---
# The interface IPs are discovered after provisioning (see the vagrant
# provisioner). Fold them back into the configuration so that every consumer
# (/etc/hosts, CTDB, backend clustering) uses the addresses the interfaces
# actually got instead of the ones computed from the settings.
- name: Adopt discovered interface IPs into the configuration
  set_fact:
    config: "{{ config | combine({'nodes': {item: {'networks': hostvars[item].discovered_networks}}}, recursive=true) }}"
  loop: "{{ config.nodes.keys() | list }}"
  when: hostvars[item].discovered_networks is defined

- name: Process OS specific tasks
  include_tasks: "{{ include_file }}"
  with_first_found:
    - files: "{{ config.os[site.os].includes }}"
  loop_control:
    loop_var: include_file

- name: Process backend specific tasks (common)
  include_role:
    name: backend
    tasks_from: common.yml

- name: Create /etc/hosts
  template:
    src: hosts.j2
    dest: /etc/hosts
